name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Siapkan proyek
        shell: bash
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -1)
          BASE=.
          if [ -n "$ZIP" ]; then
            rm -rf _src && mkdir _src
            unzip -q "$ZIP" -d _src
            BASE=_src
          fi
          ROOT=$(dirname "$(find $BASE -name settings.gradle -not -path './.git/*' | head -1)")
          echo "ROOT=$ROOT" >> $GITHUB_ENV
          echo "Proyek: $ROOT"
      - name: Siapkan keystore
        shell: bash
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ] || [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ] || \
             [ -z "${{ secrets.KEY_ALIAS }}" ] || [ -z "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "::error::Secret KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD belum diisi di Settings > Secrets and variables > Actions. Lihat README.md bagian Keamanan dan keaslian APK."
            exit 1
          fi
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/aisz-release.keystore"
          SIZE=$(stat -c%s "$RUNNER_TEMP/aisz-release.keystore" 2>/dev/null || echo 0)
          echo "Ukuran keystore hasil decode: $SIZE byte"
          if [ "$SIZE" -lt 500 ]; then
            echo "::error::Keystore hasil decode terlalu kecil ($SIZE byte) — kemungkinan isi secret KEYSTORE_BASE64 terpotong saat disalin. Salin ulang teks base64-nya secara utuh."
            exit 1
          fi
          echo "AISZ_KEYSTORE_PATH=$RUNNER_TEMP/aisz-release.keystore" >> $GITHUB_ENV
      - name: Build debug APK
        shell: bash
        env:
          AISZ_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          AISZ_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          AISZ_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set +e
          cd "$ROOT"
          gradle assembleDebug --no-daemon --console=plain --stacktrace > "$GITHUB_WORKSPACE/build.log" 2>&1
          echo "BUILD_CODE=$?" >> $GITHUB_ENV
          exit 0
      - name: ERROR KOMPILASI
        if: env.BUILD_CODE != '0'
        shell: bash
        run: |
          echo "=========== ERROR KOMPILASI (screenshot bagian ini) ==========="
          grep -E "^e: " build.log | sed -E 's#file:///home/runner/work/[^/]+/[^/]+/##' | head -60
          echo "--------------------------------------------------------------"
          grep -E "FAILED|error:|What went wrong|Caused by|Keystore|keystore" -A3 build.log | head -60
          echo "--------------------------------------------------------------"
          echo "CADANGAN — 60 baris terakhir log mentah (selalu diisi, dipakai bila dua bagian di atas kosong):"
          tail -n 60 build.log
          exit 1
      - name: Kumpulkan APK
        shell: bash
        run: |
          mkdir -p out
          cp "$ROOT/app/build/outputs/apk/debug/app-debug.apk" out/AISZ-GAME-SPACE.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AISZ-GAME-SPACE-apk
          path: out/AISZ-GAME-SPACE.apk
      - name: Simpan log build (selalu, untuk diagnosa)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
