name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Siapkan proyek
        shell: bash
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -1)
          BASE=.
          if [ -n "$ZIP" ]; then
            rm -rf _src && mkdir _src
            unzip -q "$ZIP" -d _src
            BASE=_src
          fi
          ROOT=$(dirname "$(find $BASE -name settings.gradle -not -path './.git/*' | head -1)")
          echo "ROOT=$ROOT" >> $GITHUB_ENV
          echo "Proyek: $ROOT"
      - name: Pulihkan kunci tanda tangan dari cache (bila sudah pernah dibuat)
        uses: actions/cache@v4
        with:
          path: ~/.aisz-signing
          key: aisz-signing-keystore-v1
      - name: Siapkan keystore (dibuat otomatis sekali, lalu dipakai terus — tidak perlu secret)
        shell: bash
        run: |
          set +e
          mkdir -p ~/.aisz-signing
          KS=~/.aisz-signing/aisz-release.keystore
          PROPS=~/.aisz-signing/aisz.properties
          if [ ! -f "$KS" ] || [ ! -f "$PROPS" ]; then
            echo "Kunci tanda tangan belum ada di cache — membuat baru (hanya terjadi sekali)."
            PASS=$(openssl rand -hex 16)
            keytool -genkeypair -noprompt -v -keystore "$KS" -alias aiszkey \
              -storepass "$PASS" -keypass "$PASS" -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=AISZ GAME SPACE, OU=muaidilais-star, O=AISZ, L=ID, S=ID, C=ID" > /tmp/keytool.log 2>&1
            if [ ! -f "$KS" ]; then
              echo "::error::Gagal membuat keystore baru. Log keytool:"
              cat /tmp/keytool.log
              exit 1
            fi
            printf 'password=%s\nalias=aiszkey\n' "$PASS" > "$PROPS"
            echo "Keystore baru berhasil dibuat dan akan disimpan di cache untuk build berikutnya."
          else
            echo "Keystore ditemukan di cache, dipakai lagi (tanda tangan tetap sama seperti build sebelumnya)."
          fi
          PASS=$(grep '^password=' "$PROPS" | cut -d= -f2-)
          ALIAS=$(grep '^alias=' "$PROPS" | cut -d= -f2-)
          echo "::add-mask::$PASS"
          echo "AISZ_KEYSTORE_PATH=$KS" >> $GITHUB_ENV
          echo "AISZ_KEYSTORE_PASSWORD=$PASS" >> $GITHUB_ENV
          echo "AISZ_KEY_ALIAS=$ALIAS" >> $GITHUB_ENV
          echo "AISZ_KEY_PASSWORD=$PASS" >> $GITHUB_ENV
          HASH=$(keytool -exportcert -alias "$ALIAS" -keystore "$KS" -storepass "$PASS" 2>/dev/null | sha256sum | awk '{print $1}')
          echo "=================================================================="
          echo "TANDA TANGAN SAAT INI (SHA-256) — sama di setiap build selanjutnya:"
          echo "$HASH"
          echo "Kirim baris di atas ke AISZ supaya bisa dikunci di IntegrityCheck.kt"
          echo "=================================================================="
      - name: Build debug APK
        shell: bash
        run: |
          set +e
          cd "$ROOT"
          gradle assembleDebug --no-daemon --console=plain --stacktrace > "$GITHUB_WORKSPACE/build.log" 2>&1
          echo "BUILD_CODE=$?" >> $GITHUB_ENV
          exit 0
      - name: ERROR KOMPILASI
        if: env.BUILD_CODE != '0'
        shell: bash
        run: |
          set +e
          echo "=========== ERROR KOMPILASI (screenshot bagian ini) ==========="
          echo "[1] Baris error Kotlin (bila ada):"
          grep -E "^e: " build.log | sed -E 's#file:///home/runner/work/[^/]+/[^/]+/##' | head -60
          echo "--------------------------------------------------------------"
          echo "[2] Baris kegagalan Gradle (bila ada):"
          grep -E "FAILED|error:|What went wrong|Caused by|Keystore|keystore" -A3 build.log | head -60
          echo "--------------------------------------------------------------"
          echo "[3] 80 baris TERAKHIR log mentah (paling penting bila [1] dan [2] kosong):"
          tail -n 80 build.log
          echo "================================================================"
          true
          exit 1
      - name: Kumpulkan APK
        shell: bash
        run: |
          mkdir -p out
          cp "$ROOT/app/build/outputs/apk/debug/app-debug.apk" out/AISZ-GAME-SPACE.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AISZ-GAME-SPACE-apk
          path: out/AISZ-GAME-SPACE.apk
      - name: Simpan log build (selalu, untuk diagnosa)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          
