name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Siapkan proyek
        shell: bash
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -1)
          BASE=.
          if [ -n "$ZIP" ]; then
            rm -rf _src && mkdir _src
            unzip -q "$ZIP" -d _src
            BASE=_src
          fi
          ROOT=$(dirname "$(find $BASE -name settings.gradle -not -path './.git/*' | head -1)")
          echo "ROOT=$ROOT" >> $GITHUB_ENV
          echo "Proyek: $ROOT"
      - name: Siapkan keystore
        shell: bash
        run: |
          set +e
          HEX="${{ secrets.KEYSTORE_HEX }}"
          if [ -z "$HEX" ] || [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ] || \
             [ -z "${{ secrets.KEY_ALIAS }}" ] || [ -z "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "::error::Secret KEYSTORE_HEX / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD belum diisi di Settings > Secrets and variables > Actions. Lihat README.md bagian Keamanan dan keaslian APK."
            exit 1
          fi
          LEN=${#HEX}
          echo "Panjang KEYSTORE_HEX yang diterima: $LEN karakter (harus 5492)"
          if [ "$LEN" -ne 5492 ]; then
            echo "::error::Panjang KEYSTORE_HEX salah ($LEN karakter, seharusnya 5492). Secret ini rusak/terpotong saat disalin — hapus secretnya, lalu buat ulang dan salin ULANG teks hex-nya secara utuh dari pesan AISZ."
            exit 1
          fi
          python3 -c "
          import sys
          data = sys.argv[1]
          try:
              raw = bytes.fromhex(data)
          except ValueError as e:
              print('::error::Teks KEYSTORE_HEX mengandung karakter yang bukan hex (0-9a-f): ' + str(e))
              sys.exit(1)
          open(sys.argv[2], 'wb').write(raw)
          " "$HEX" "$RUNNER_TEMP/aisz-release.keystore" || exit 1
          GOT=$(sha256sum "$RUNNER_TEMP/aisz-release.keystore" | awk '{print $1}')
          WANT="874a68dc8c1dc47eeddf3160818926fbad4afaa93cc8f1078b6558d1f346d4de"
          echo "Checksum keystore hasil decode: $GOT"
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::Checksum keystore tidak cocok (dapat $GOT, seharusnya $WANT). File keystore rusak saat disalin walau panjangnya benar. Buat ulang secret KEYSTORE_HEX, salin ulang dengan hati-hati."
            exit 1
          fi
          echo "Keystore terverifikasi cocok persis dengan aslinya."
          echo "AISZ_KEYSTORE_PATH=$RUNNER_TEMP/aisz-release.keystore" >> $GITHUB_ENV
      - name: Build debug APK
        shell: bash
        env:
          AISZ_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          AISZ_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          AISZ_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set +e
          cd "$ROOT"
          gradle assembleDebug --no-daemon --console=plain --stacktrace > "$GITHUB_WORKSPACE/build.log" 2>&1
          echo "BUILD_CODE=$?" >> $GITHUB_ENV
          exit 0
      - name: ERROR KOMPILASI
        if: env.BUILD_CODE != '0'
        shell: bash
        run: |
          set +e
          echo "=========== ERROR KOMPILASI (screenshot bagian ini) ==========="
          echo "[1] Baris error Kotlin (bila ada):"
          grep -E "^e: " build.log | sed -E 's#file:///home/runner/work/[^/]+/[^/]+/##' | head -60
          echo "--------------------------------------------------------------"
          echo "[2] Baris kegagalan Gradle (bila ada):"
          grep -E "FAILED|error:|What went wrong|Caused by|Keystore|keystore" -A3 build.log | head -60
          echo "--------------------------------------------------------------"
          echo "[3] 80 baris TERAKHIR log mentah (paling penting bila [1] dan [2] kosong):"
          tail -n 80 build.log
          echo "================================================================"
          true
          exit 1
      - name: Kumpulkan APK
        shell: bash
        run: |
          mkdir -p out
          cp "$ROOT/app/build/outputs/apk/debug/app-debug.apk" out/AISZ-GAME-SPACE.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AISZ-GAME-SPACE-apk
          path: out/AISZ-GAME-SPACE.apk
      - name: Simpan log build (selalu, untuk diagnosa)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
